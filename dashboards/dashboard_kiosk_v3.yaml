title: Kiosk Pro
views:
  - title: Overview
    path: default_view
    icon: mdi:view-dashboard
    theme: kiosk-dark
    type: panel
    cards:
      - type: custom:layout-card
        layout: "no-gap"
        options:
          display: "grid"
          grid-template-columns: "1fr 1fr 1fr"
          grid-template-rows: "auto auto auto auto auto"
          grid-template-areas: |
            "header header header"
            "cameras cameras network"
            "cameras cameras roborock"
            "living living printer"
            "3dprinter 3dprinter system"
        style:
          - ".card-container":
              gap: "12px"
              padding: "16px"
              background: "var(--primary-background-color)"
        cards:
          header:
            - type: custom:mushroom-chips-card
              alignment: "justify"
              chips:
                - type: template
                  entity: person.chartwell
                  content: "{{ '🏠 Home' if is_state('person.chartwell', 'home') else '🚪 Away' }}"
                  icon: mdi:account
                - type: template
                  entity: weather.forecast_home
                  content: "{{ state_attr('weather.forecast_home', 'temperature') | int }}°C"
                  icon: mdi:weather-partly-cloudy
                - type: template
                  entity: sensor.unifi_dream_machine_external_ip
                  content: "{{ states('sensor.unifi_dream_machine_external_ip') }}"
                  icon: mdi:wan
                - type: template
                  entity: sensor.dream_machine_se_storage_utilisation
                  content: "{{ states('sensor.dream_machine_se_storage_utilisation') | round(1) }}%"
                  icon: mdi:harddisk

          cameras:
            - type: vertical-stack
              cards:
                - type: custom:button-card
                  name: G5 Dome (Front)
                  entity: binary_sensor.g5_dome_person_detected
                  show_state: true
                  styles:
                    card: [height: "60px"]
                - type: picture-glance
                  camera_image: camera.g5_dome_high_resolution_channel
                  entities:
                    - entity: binary_sensor.g5_dome_person_detected
                  camera_view: live
                - type: picture-glance
                  camera_image: camera.g3_bullet_high_resolution_channel
                  entities:
                    - entity: binary_sensor.g3_bullet_motion
                  camera_view: live

          network:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-template-card
                  primary: "UDM SE"
                  secondary: "CPU: {{ states('sensor.dream_machine_se_cpu_utilization') }}% | MEM: {{ states('sensor.dream_machine_se_memory_utilization') }}%"
                  icon: mdi:router-wireless
                  style:
                    ha-card: [height: "80px"]
                - type: custom:mini-graph-card
                  entity: sensor.unifi_dream_machine_download_speed
                  name: Speed
                  hours_to_show: 6
                - type: custom:mushroom-template-card
                  primary: "U6+ APs"
                  secondary: "CPU: {{ states('sensor.u6_cpu_utilization') }}%"
                  icon: mdi:access-point
                  style:
                    ha-card: [height: "60px"]

          roborock:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-template-card
                  primary: "Roborock S7"
                  secondary: "{{ states('sensor.roborock_s7_status') }}"
                  icon: mdi:robot-vacuum
                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      name: Start
                      icon: mdi:play
                      tap_action:
                        action: perform-action
                        action_name: vacuum.start
                        target: { entity_id: vacuum.roborock_s7 }
                      styles: { card: [height: "50px"] }
                    - type: custom:button-card
                      name: Home
                      icon: mdi:home
                      tap_action:
                        action: perform-action
                        action_name: vacuum.return_to_base
                        target: { entity_id: vacuum.roborock_s7 }
                      styles: { card: [height: "50px"] }

          living:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-light-card
                  entity: light.front_door_light
                  name: Front Door
                - type: custom:mushroom-media-card
                  entity: media_player.master_bedroom_tv
                  name: Bedroom TV
                - type: custom:mushroom-select-card
                  entity: select.harmony_hub_activities
                  name: Harmony

          printer:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-template-card
                  primary: "ECOSYS M6030cdn"
                  secondary: "Black: {{ states('sensor.ecosys_m6030cdn_black_tk_5144k') }}%"
                  icon: mdi:printer
                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: "K: {{ states('sensor.ecosys_m6030cdn_black_tk_5144k') }}%"
                      icon: mdi:printer-3d
                      style: { ha-card: [height: "60px"] }
                    - type: custom:mushroom-template-card
                      primary: "C: {{ states('sensor.ecosys_m6030cdn_cyan_tk_5144c') }}%"
                      icon: mdi:printer-3d
                      style: { ha-card: [height: "60px"] }

          "3dprinter":
            - type: vertical-stack
              cards:
                - type: custom:mushroom-template-card
                  primary: "Centauri Carbon"
                  secondary: "Status: {{ states('sensor.centauri_carbon_current_status') }} | Layer: {{ states('sensor.centauri_carbon_current_layer') }}"
                  icon: mdi:cube-outline
                  tap_action:
                    action: more-info
                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: "Bed: {{ states('sensor.centauri_carbon_bed_temperature') }}°C"
                      icon: mdi:thermometer
                      style: { ha-card: [height: "60px"] }
                    - type: custom:mushroom-template-card
                      primary: "Noz: {{ states('sensor.centauri_carbon_nozzle_temperature') }}°C"
                      icon: mdi:thermometer-high
                      style: { ha-card: [height: "60px"] }
                - type: picture-glance
                  camera_image: camera.centauri_carbon_chamber_camera
                  camera_view: live
                  entities:
                    - entity: light.centauri_carbon_chamber_light

          system:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-template-card
                  primary: "System Health"
                  secondary: "Backup: {{ states('sensor.backup_backup_manager_state') }}"
                  icon: mdi:shield-check
                - type: custom:mushroom-template-card
                  primary: "git-ha-ppens"
                  secondary: "Branch: {{ states('sensor.git_ha_ppens_branch') }}"
                  icon: mdi:git
                  style: { ha-card: [height: "60px"] }
