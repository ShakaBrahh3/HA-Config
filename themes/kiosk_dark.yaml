+# Kiosk Dark Theme — for HP Elite x2 (1920×1280) in landscape kiosk mode
+# Install: copy to config/themes/kiosk_dark.yaml, then Settings → Themes → Add theme → select this file
+# Then: Profile → Theme → "Kiosk Dark"
+
+kiosk-dark:
+  # ---- Base colors ----
+  primary-color: "#00d4aa"              # Teal accent
+  primary-light-color: "#33e8c0"
+  primary-dark-color: "#00b08a"
+  accent-color: "#ff6b6b"               # Coral for alerts
+  accent-light-color: "#ff9a9a"
+  accent-dark-color: "#e04444"
+
+  # ---- Background ----
+  primary-background-color: "#0d1117"   # Near-black
+  secondary-background-color: "#161b22" # Card background
+  tertiary-background-color: "#21262d"  # Hover/pressed
+  card-background-color: "rgba(22, 27, 34, 0.9)"
+  ha-card-background: "rgba(22, 27, 34, 0.92)"
+  ha-card-border-color: "rgba(48, 54, 61, 0.5)"
+
+  # ---- Text ----
+  primary-text-color: "#e6edf3"
+  secondary-text-color: "#8b949e"
+  text-primary-color: "#e6edf3"
+  text-secondary-color: "#8b949e"
+  disabled-text-color: "#484f58"
+
+  # ---- Borders / Dividers ----
+  divider-color: "rgba(48, 54, 61, 0.6)"
+  dark-divider-opacity: "0.4"
+  light-divider-opacity: "0.15"
+
+  # ---- Shadows / Elevation ----
+  shadow-elevation-1dp: "0 1px 3px rgba(0,0,0,0.4)"
+  shadow-elevation-2dp: "0 2px 6px rgba(0,0,0,0.4)"
+  shadow-elevation-4dp: "0 4px 12px rgba(0,0,0,0.5)"
+  shadow-elevation-8dp: "0 8px 24px rgba(0,0,0,0.6)"
+  shadow-elevation-16dp: "0 16px 48px rgba(0,0,0,0.7)"
+
+  # ---- State colors ----
+  state-active-color: "#00d4aa"
+  state-inactive-color: "#8b949e"
+  state-unavailable-color: "#484f58"
+  state-warning-color: "#f0883e"
+  state-error-color: "#ff6b6b"
+
+  # ---- Switch / Toggle ----
+  switch-checked-track-color: "#00d4aa"
+  switch-checked-button-color: "#0d1117"
+  switch-unchecked-track-color: "#30363d"
+  switch-unchecked-button-color: "#8b949e"
+
+  # ---- Slider ----
+  slider-track-color: "#30363d"
+  slider-active-track-color: "#00d4aa"
+  slider-container-color: "rgba(0, 212, 170, 0.15)"
+
+  # ---- Input / Select ----
+  input-background-color: "#0d1117"
+  input-border-color: "#30363d"
+  input-text-color: "#e6edf3"
+  input-disabled-background-color: "#161b22"
+  input-disabled-text-color: "#484f58"
+
+  # ---- Table / List ----
+  table-row-background-color: "#161b22"
+  table-row-alternative-background-color: "#0d1117"
+  table-header-text-color: "#8b949e"
+
+  # ---- Sidebar ----
+  sidebar-background-color: "#0d1117"
+  sidebar-text-color: "#e6edf3"
+  sidebar-icon-color: "#8b949e"
+  sidebar-selected-background-color: "#161b22"
+  sidebar-selected-text-color: "#00d4aa"
+  sidebar-selected-icon-color: "#00d4aa"
