title: Homelab Overview
views:
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    cards:
      # =========================================================
      # SECTION 1: HEADER STRIP
      # One glance, one viewport. Who's home, time-of-day, weather,
      # internet up?, camera alert?, backup fresh?.
      # =========================================================
      - type: horizontal-stack
        cards:
          - type: glance
            title: Home
            entities:
              - entity: person.chartwell
                name: You
              - entity: sun.sun
                name: Sun
              - entity: weather.forecast_home
                name: Weather
              - entity: sensor.bm_oppo_x8_pro_battery_level
                name: Phone
                icon: mdi:cellphone

          - type: glance
            title: Alerts
            entities:
              - entity: binary_sensor.g5_dome_person_detected
                name: Front person
                icon: mdi:account-alert
              - entity: binary_sensor.g3_bullet_motion
                name: G3 motion
              - entity: binary_sensor.g3_bullet_motion_2
                name: G3 motion 2
              - entity: binary_sensor.unifi_dream_machine_wan_status
                name: WAN
                icon: mdi:wan

      - type: markdown
        content: |
          ## Good {{ now().strftime('%A') }} — {{ now().strftime('%H:%M') }}
          {{ states('weather.forecast_home') | title }} · {{ state_attr('weather.forecast_home', 'temperature') }}°C
          {% if is_state('person.chartwell', 'home') %}· You're home{% endif %}
          {% if is_state('binary_sensor.g5_dome_person_detected', 'on') %}· ⚠️ **Person at front**{% endif %}
          {% if states('sensor.dream_machine_se_storage_utilisation') | float(0) > 90 %}· ⚠️ **UDM SE storage {{ states('sensor.dream_machine_se_storage_utilisation') }}%**{% endif %}
          {% if states('sensor.unifi_dream_machine_external_ip') == '0.0.0.0' %}· ⚠️ **No external IP**{% endif %}
          {% if states('sensor.ecosys_m6030cdn_black_tk_5144k') | float(100) < 15 %}· 🖨️ **Black toner low ({{ states('sensor.ecosys_m6030cdn_black_tk_5144k') }}%)**{% endif %}

      # =========================================================
      # SECTION 2: SECURITY & CAMERAS
      # =========================================================
      - type: heading
        content: Security & Cameras

      - type: picture-glance
        title: G5 Dome (Front)
        entities:
          - entity: binary_sensor.g5_dome_person_detected
          - entity: binary_sensor.g5_dome_motion
          - entity: binary_sensor.g5_dome_animal_detected
        camera_image: camera.g5_dome_high_resolution_channel
        camera_view: live
        show_state: false

      - type: picture-glance
        title: G3 Bullet (Primary)
        entities:
          - entity: binary_sensor.g3_bullet_motion
        camera_image: camera.g3_bullet_high_resolution_channel
        camera_view: live
        show_state: false

      - type: picture-glance
        title: G3 Bullet (Secondary)
        entities:
          - entity: binary_sensor.g3_bullet_motion_2
        camera_image: camera.g3_bullet_high_resolution_channel_2
        camera_view: live
        show_state: false

      - type: glance
        title: Camera Storage
        entities:
          - entity: sensor.g5_dome_storage_used
            name: G5 Dome
          - entity: sensor.g3_bullet_storage_used
            name: G3 Bullet
          - entity: sensor.g3_bullet_storage_used_2
            name: G3 Bullet 2

      # =========================================================
      # SECTION 3: NETWORK
      # =========================================================
      - type: heading
        content: Network

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.dream_machine_se_cpu_utilization
            name: UDM SE CPU
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 70
              yellow: 40
              green: 0
          - type: gauge
            entity: sensor.dream_machine_se_memory_utilization
            name: UDM SE MEM
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 80
              yellow: 50
              green: 0
          - type: gauge
            entity: sensor.dream_machine_se_storage_utilisation
            name: UDM SE Disk
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 85
              yellow: 70
              green: 0

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.u6_cpu_utilization
            name: U6+ #1 CPU
            unit: '%'
            min: 0
            max: 100
            needle: true
          - type: gauge
            entity: sensor.u6_memory_utilization
            name: U6+ #1 MEM
            unit: '%'
            min: 0
            max: 100
            needle: true
          - type: gauge
            entity: sensor.u6_cpu_utilization_2
            name: U6+ #2 CPU
            unit: '%'
            min: 0
            max: 100
            needle: true
          - type: gauge
            entity: sensor.u6_memory_utilization_2
            name: U6+ #2 MEM
            unit: '%'
            min: 0
            max: 100
            needle: true
          - type: gauge
            entity: sensor.usw_flex_cpu_utilization
            name: USW Flex
            unit: '%'
            min: 0
            max: 100
            needle: true

      - type: glance
        title: WAN / ISP
        entities:
          - entity: binary_sensor.unifi_dream_machine_wan_status
            name: WAN
          - entity: sensor.unifi_dream_machine_external_ip
            name: Public IP
          - entity: sensor.unifi_dream_machine_download_speed
            name: Down
          - entity: sensor.unifi_dream_machine_upload_speed
            name: Up
          - entity: sensor.pentanet
            name: Pentanet

      - type: history-graph
        title: Internet Speed (24h)
        hours_to_show: 24
        entities:
          - entity: sensor.unifi_dream_machine_download_speed
            name: Down
          - entity: sensor.unifi_dream_machine_upload_speed
            name: Up

      # =========================================================
      # SECTION 4: CLIMATE & POWER
      # =========================================================
      - type: heading
        content: Climate & Power

      - type: horizontal-stack
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: true
          - type: entities
            title: Sun
            entities:
              - entity: sensor.sun_next_dawn
                name: Dawn
              - entity: sensor.sun_next_rising
                name: Rise
              - entity: sensor.sun_next_dusk
                name: Dusk
              - entity: sensor.sun_next_setting
                name: Set
              - entity: sensor.sun_next_noon
                name: Noon

      # =========================================================
      # SECTION 5: LIVING SPACES
      # =========================================================
      - type: heading
        content: Living Spaces

      - type: horizontal-stack
        cards:
          - type: light
            entity: light.front_door_light
            name: Front Door
          - type: media-control
            entity: media_player.master_bedroom_tv
            name: Bedroom TV
          - type: media-control
            entity: media_player.main_lounge_speaker
            name: Lounge
          - type: media-control
            entity: media_player.nesthub3080
            name: Bedroom Display

      - type: entities
        title: Harmony Hub
        entities:
          - entity: select.harmony_hub_activities
            name: Activity
          - entity: remote.harmony_hub
            name: Hub state

      # =========================================================
      # SECTION 6: ROBOROCK S7
      # =========================================================
      - type: heading
        content: Roborock S7

      - type: vertical-stack
        cards:
          - type: glance
            title: Status
            entities:
              - entity: vacuum.roborock_s7
                name: State
              - entity: sensor.roborock_s7_battery
                name: Battery
              - entity: sensor.roborock_s7_status
                name: Status
              - entity: binary_sensor.roborock_s7_charging
                name: Charging
              - entity: sensor.roborock_s7_current_room
                name: Room
              - entity: sensor.roborock_s7_vacuum_error
                name: Error
              - entity: sensor.roborock_s7_cleaning_area
                name: Last area
              - entity: sensor.roborock_s7_cleaning_time
                name: Last time

          - type: horizontal-stack
            cards:
              - type: button
                entity: vacuum.roborock_s7
                name: Start
                icon: mdi:play
                tap_action:
                  action: perform-action
                  action_name: vacuum.start
                  target:
                    entity_id: vacuum.roborock_s7
                show_state: false
              - type: button
                entity: vacuum.roborock_s7
                name: Pause
                icon: mdi:pause
                tap_action:
                  action: perform-action
                  action_name: vacuum.pause
                  target:
                    entity_id: vacuum.roborock_s7
                show_state: false
              - type: button
                entity: vacuum.roborock_s7
                name: Home
                icon: mdi:home
                tap_action:
                  action: perform-action
                  action_name: vacuum.return_to_base
                  target:
                    entity_id: vacuum.roborock_s7
                show_state: false

          - type: entities
            title: Modes
            entities:
              - entity: select.roborock_s7_mop_intensity
              - entity: select.roborock_s7_mop_mode
              - entity: number.roborock_s7_volume
              - entity: switch.roborock_s7_do_not_disturb
              - entity: switch.roborock_s7_dock_child_lock

          - type: glance
            title: Consumables (hours left)
            entities:
              - entity: sensor.roborock_s7_main_brush_time_left
                name: Main brush
              - entity: sensor.roborock_s7_side_brush_time_left
                name: Side brush
              - entity: sensor.roborock_s7_filter_time_left
                name: Filter
              - entity: sensor.roborock_s7_sensor_time_left
                name: Cliff sensor

      # =========================================================
      # SECTION 7: PRINTER
      # =========================================================
      - type: heading
        content: Printer — ECOSYS M6030cdn

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.ecosys_m6030cdn_black_tk_5144k
            name: Black
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.ecosys_m6030cdn_cyan_tk_5144c
            name: Cyan
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.ecosys_m6030cdn_magenta_tk_5144m
            name: Magenta
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.ecosys_m6030cdn_yellow_tk_5144y
            name: Yellow
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10
              yellow: 25
              green: 50

      - type: glance
        title: Printer State
        entities:
          - entity: sensor.ecosys_m6030cdn
            name: State
          - entity: sensor.ecosys_m6030cdn_waste_toner_box
            name: Waste toner

      # =========================================================
      # SECTION 8: UPDATES
      # =========================================================
      - type: heading
        content: Updates

      - type: glance
        title: Pending Updates
        entities:
          - entity: update.hacs_update
            name: HACS
          - entity: update.mushroom_update
            name: Mushroom
          - entity: update.mcp_server_http_transport_update
            name: MCP Server
          - entity: update.ai_automation_suggester_update
            name: AI Auto Suggester
          - entity: update.ai_agent_ha_update
            name: AI Agent HA
          - entity: update.unifi_device_card_update
            name: UniFi Device Card
          - entity: update.ssh_update
            name: SSH
          - entity: update.u6
            name: U6+ #1
          - entity: update.u6_2
            name: U6+ #2
          - entity: update.usw_flex
            name: USW Flex
          - entity: update.dream_machine_se
            name: UDM SE

      # =========================================================
      # SECTION 9: QUICK ACTIONS
      # =========================================================
      - type: heading
        content: Quick Actions

      - type: horizontal-stack
        cards:
          - type: button
            name: Flash Front Light
            icon: mdi:lightbulb-on
            show_state: false
            tap_action:
              action: perform-action
              action_name: light.toggle
              target:
                entity_id: light.front_door_light
          - type: button
            name: Vacuum Start
            icon: mdi:robot-vacuum
            show_state: false
            tap_action:
              action: perform-action
              action_name: vacuum.start
              target:
                entity_id: vacuum.roborock_s7
          - type: button
            name: Vacuum Home
            icon: mdi:home
            show_state: false
            tap_action:
              action: perform-action
              action_name: vacuum.return_to_base
              target:
                entity_id: vacuum.roborock_s7
          - type: button
            name: Bedroom TV Off
            icon: mdi:television-off
            show_state: false
            tap_action:
              action: perform-action
              action_name: media_player.turn_off
              target:
                entity_id: media_player.master_bedroom_tv

      # =========================================================
      # SECTION 10: SYSTEM HEALTH
      # =========================================================
      - type: heading
        content: System Health

      - type: glance
        title: Backups
        entities:
          - entity: sensor.backup_backup_manager_state
            name: Manager
          - entity: sensor.backup_last_successful_automatic_backup
            name: Last OK
          - entity: sensor.backup_next_scheduled_automatic_backup
            name: Next

      - type: entities
        title: Homelab Host
        entities:
          - entity: device_tracker.homelab
            name: Tracker
