title: Kiosk
views:
  - title: Overview
    path: default_view
    icon: mdi:view-dashboard
    theme: kiosk-dark
    type: panel
    cards:
      - type: custom:layout-card
        layout: "no-gap"
        options:
          display: "grid"
          grid-template-columns: "1fr 1fr 1fr"
          grid-template-rows: "auto auto auto auto"
          grid-template-areas: |
            "header header header"
            "cameras cameras network"
            "cameras cameras roborock"
            "living living printer"
            "updates updates quickactions"
            "system system system"
        style:
          - ".card-container":
              gap: "12px"
              padding: "16px"
              background: "var(--primary-background-color)"
              height: "100%"
        cards:
          # --- HEADER ---
          header:
            - type: custom:mushroom-chips-card
              title: "Homelab"
              subtitle: |
                {{ states('person.chartwell') == 'home' and 'You are home' or 'You are away' }}
              alignment: "justify"
              chip_tap_action:
                action: more-info
                entity: person.chartwell
              chips:
                - type: template
                  entity: person.chartwell
                  content: "{{ states('person.chartwell') == 'home' and '🏠 Home' or '🚪 Away' }}"
                  icon: mdi:account
                  tap_action:
                    action: more-info
                    entity: person.chartwell
                - type: template
                  entity: weather.forecast_home
                  content: "{{ state_attr('weather.forecast_home','temperature') | int }}°C"
                  icon: mdi:weather-partly-cloudy
                  tap_action:
                    action: more-info
                    entity: weather.forecast_home
                - type: template
                  entity: sensor.unifi_dream_machine_external_ip
                  content: |
                    {% set ip = states('sensor.unifi_dream_machine_external_ip') %}
                    {{ ip == '0.0.0.0' and '⚠️ No IP' or ip[:14] }}
                  icon: mdi:wan
                  tap_action:
                    action: more-info
                    entity: sensor.unifi_dream_machine_external_ip
                - type: template
                  entity: sensor.dream_machine_se_storage_utilisation
                  content: "{{ states('sensor.dream_machine_se_storage_utilisation') | round(1) }}%"
                  icon: mdi:harddisk-full
                  tap_action:
                    action: more-info
                    entity: sensor.dream_machine_se_storage_utilisation
                  style: |
                    ha-card {
                      {% if states('sensor.dream_machine_se_storage_utilisation') | float > 90 %}
                      background: rgba(255,107,107,0.15);
                      {% elif states('sensor.dream_machine_se_storage_utilisation') | float > 75 %}
                      background: rgba(240,138,61,0.15);
                      {% endif %}
                    }
                - type: template
                  entity: binary_sensor.unifi_dream_machine_wan_status
                  content: "{{ is_state('binary_sensor.unifi_dream_machine_wan_status','on') and '🟢' or '🔴' }}"
                  icon: mdi:ethernet
                  tap_action:
                    action: more-info
                    entity: binary_sensor.unifi_dream_machine_wan_status

          # --- CAMERAS (big, takes 2 cols) ---
          cameras:
            - type: vertical-stack
              cards:
                - type: custom:button-card
                  name: G5 Dome Front Door
                  icon: mdi:doorbell-video
                  entity: binary_sensor.g5_dome_person_detected
                  show_state: true
                  state:
                    - value: "on"
                      color: var(--accent-color)
                      styles:
                        name:
                          - color: "#ff6b6b"
                          - font-weight: "bold"
                        state:
                          - color: "#ff6b6b"
                          - font-weight: "bold"
                    - value: "off"
                      color: var(--state-inactive-color)
                  tap_action:
                    action: more-info
                    entity: binary_sensor.g5_dome_person_detected
                  hold_action:
                    action: navigate
                    navigation_path: /lovelace/0?entity=binary_sensor.g5_dome_person_detected
                  styles:
                    card:
                      - height: "120px"
                      - font-size: "14px"
                      - padding: "8px"
                    name:
                      - font-size: "12px"

                - type: picture-glance
                  title: G5 Dome Live
                  entities:
                    - entity: binary_sensor.g5_dome_person_detected
                      name: Person
                    - entity: binary_sensor.g5_dome_motion
                      name: Motion
                    - entity: binary_sensor.g5_dome_animal_detected
                      name: Animal
                    - entity: sensor.g5_dome_recording_mode
                      name: Rec
                  camera_image: camera.g5_dome_high_resolution_channel
                  camera_view: live
                  show_name: true
                  show_state: false

                - type: picture-glance
                  title: G3 Bullet (Primary)
                  entities:
                    - entity: binary_sensor.g3_bullet_motion
                      name: Motion
                    - entity: sensor.g3_bullet_recording_mode
                      name: Rec
                  camera_image: camera.g3_bullet_high_resolution_channel
                  camera_view: live
                  show_name: true
                  show_state: false

                - type: picture-glance
                  title: G3 Bullet (Secondary)
                  entities:
                    - entity: binary_sensor.g3_bullet_motion_2
                      name: Motion
                    - entity: sensor.g3_bullet_recording_mode_2
                      name: Rec
                  camera_image: camera.g3_bullet_high_resolution_channel_2
                  camera_view: live
                  show_name: true
                  show_state: false

          # --- NETWORK ---
          network:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-template-card
                  primary: "UDM SE"
                  secondary: |
                    CPU: {{ states('sensor.dream_machine_se_cpu_utilization') }}% · MEM: {{ states('sensor.dream_machine_se_memory_utilization') }}%
                  icon: mdi:router-wireless
                  entity: sensor.dream_machine_se_cpu_utilization
                  tap_action:
                    action: more-info
                    entity: sensor.dream_machine_se_cpu_utilization
                  style:
                    ha-card:
                      - height: "80px"

                - type: custom:mini-graph-card
                  entity: sensor.unifi_dream_machine_download_speed
                  name: Internet Speed
                  show:
                    name: true
                    state: true
                    graph: line
                    labels: false
                    icon: false
                  line_width: 3
                  line_color: var(--primary-color)
                  background: rgba(22,27,34,0.8)
                  hours_to_show: 6
                  refresh_interval: 60

                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: "U6+ #1"
                      secondary: "{{ states('sensor.u6_cpu_utilization') }}% / {{ states('sensor.u6_memory_utilization') }}%"
                      icon: mdi:access-point
                      entity: sensor.u6_cpu_utilization
                      tap_action:
                        action: more-info
                        entity: sensor.u6_cpu_utilization
                      style:
                        ha-card:
                          - height: "60px"
                    - type: custom:mushroom-template-card
                      primary: "U6+ #2"
                      secondary: "{{ states('sensor.u6_cpu_utilization_2') }}% / {{ states('sensor.u6_memory_utilization_2') }}%"
                      icon: mdi:access-point
                      entity: sensor.u6_cpu_utilization_2
                      tap_action:
                        action: more-info
                        entity: sensor.u6_cpu_utilization_2
                      style:
                        ha-card:
                          - height: "60px"
                    - type: custom:mushroom-template-card
                      primary: "USW-Flex"
                      secondary: "{{ states('sensor.usw_flex_cpu_utilization') }}% / {{ states('sensor.usw_flex_memory_utilization') }}%"
                      icon: mdi:network-switch
                      entity: sensor.usw_flex_cpu_utilization
                      tap_action:
                        action: more-info
                        entity: sensor.usw_flex_cpu_utilization
                      style:
                        ha-card:
                          - height: "60px"

          # --- ROBOROCK ---
          roborock:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: "{{ 'Roborock S7' }}"
                    - type: text
                      text: "{{ state_attr('vacuum.roborock_s7','status') }}"
                      font_size: "small"
                      color: var(--secondary-text-color)

                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      name: Start
                      icon: mdi:play
                      tap_action:
                        action: perform-action
                        action_name: vacuum.start
                        target:
                          entity_id: vacuum.roborock_s7
                      styles:
                        card:
                          - height: "60px"
                    - type: custom:button-card
                      name: Pause
                      icon: mdi:pause
                      tap_action:
                        action: perform-action
                        action_name: vacuum.pause
                        target:
                          entity_id: vacuum.roborock_s7
                      styles:
                        card:
                          - height: "60px"
                    - type: custom:button-card
                      name: Home
                      icon: mdi:home
                      tap_action:
                        action: perform-action
                        action_name: vacuum.return_to_base
                        target:
                          entity_id: vacuum.roborock_s7
                      styles:
                        card:
                          - height: "60px"

                - type: custom:mini-graph-card
                  entity: sensor.roborock_s7_battery
                  name: Battery
                  show:
                    name: true
                    state: true
                    graph: line
                    icon: false
                  line_color: var(--primary-color)
                  background: rgba(22,27,34,0.8)
                  hours_to_show: 24
                  refresh_interval: 60

          # --- LIVING SPACES ---
          living:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-light-card
                  entity: light.front_door_light
                  name: Front Door Light
                  show_mode: true
                  show_secondary: true
                  tap_action:
                    action: more-info

                - type: entities
                  title: Media
                  show_header: true
                  cards:
                    - type: custom:layout-card
                      layout: horizontal
                      cards:
                        - type: custom:mushroom-media-card
                          entity: media_player.master_bedroom_tv
                          name: Bedroom TV
                          show_state: true
                          tap_action:
                            action: more-info
                        - type: custom:mushroom-media-card
                          entity: media_player.main_lounge_speaker
                          name: Lounge Speaker
                          show_state: true
                          tap_action:
                            action: more-info

                - type: custom:mushroom-select-card
                  entity: select.harmony_hub_activities
                  name: Harmony Activity
                  show_state: true
                  tap_action:
                    action: more-info

          # --- PRINTER ---
          printer:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: "ECOSYS M6030cdn"
                    - type: text
                      text: "{{ states('sensor.ecosys_m6030cdn') }}"
                      font_size: "small"
                      color: var(--secondary-text-color)

                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: "K: {{ states('sensor.ecosys_m6030cdn_black_tk_5144k') }}%"
                      secondary: "Black"
                      icon: mdi:printer-3d
                      entity: sensor.ecosys_m6030cdn_black_tk_5144k
                      tap_action:
                        action: more-info
                        entity: sensor.ecosys_m6030cdn_black_tk_5144k
                      style:
                        ha-card:
                          - height: "60px"
                          - background: |
                              {% if states('sensor.ecosys_m6030cdn_black_tk_5144k') | float < 15 %}
                              linear-gradient(90deg, rgba(255,107,107,0.2) 0%, transparent 100%)
                              {% endif %}
                          - color: |
                              {% if states('sensor.ecosys_m6030cdn_black_tk_5144k') | float < 15 %}
                              var(--state-error-color)
                              {% endif %}
                    - type: custom:mushroom-template-card
                      primary: "{{ states('sensor.ecosys_m6030cdn_cyan_tk_5144c') }}%"
                      secondary: "Cyan"
                      icon: mdi:printer-3d
                      entity: sensor.ecosys_m6030cdn_cyan_tk_5144c
                      style:
                        ha-card:
                          - height: "60px"
                    - type: custom:mushroom-template-card
                      primary: "{{ states('sensor.ecosys_m6030cdn_magenta_tk_5144m') }}%"
                      secondary: "Magenta"
                      icon: mdi:printer-3d
                      entity: sensor.ecosys_m6030cdn_magenta_tk_5144m
                      style:
                        ha-card:
                          - height: "60px"
                    - type: custom:mushroom-template-card
                      primary: "{{ states('sensor.ecosys_m6030cdn_yellow_tk_5144y') }}%"
                      secondary: "Yellow"
                      icon: mdi:printer-3d
                      entity: sensor.ecosys_m6030cdn_yellow_tk_5144y
                      style:
                        ha-card:
                          - height: "60px"

          # --- UPDATES ---
          updates:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: "Updates Available"
                    - type: text
                      text: |
                        {% set updates = [
                          "update.hacs_update",
                          "update.mushroom_update",
                          "update.mcp_server_http_transport_update",
                          "update.ai_automation_suggester_update",
                          "update.ai_agent_ha_update",
                          "update.unifi_device_card_update",
                          "update.ssh_update",
                          "update.dream_machine_se",
                          "update.u6",
                          "update.u6_2",
                          "update.usw_flex"
                        ] %}
                        {% set pending = updates | select('extract_entity_id') | select('states') | select('!=', 'off') | select('!=', 'unavailable') | list %}
                        {{ pending | length }} pending
                      font_size: "small"
                      color: var(--secondary-text-color)

                - type: horizontal-scroll
                  cards:
                    - type: custom:button-card
                      name: Update All
                      icon: mdi:update
                      tap_action:
                        action: perform-action
                        action_name: update.install
                        target: {}
                      styles:
                        card:
                          - height: "50px"

          # --- QUICK ACTIONS ---
          quickactions:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: "Quick Actions"

                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      name: Flash Front Light
                      icon: mdi:lightbulb-on-flash
                      tap_action:
                        action: perform-action
                        action_name: light.toggle
                        target:
                          entity_id: light.front_door_light
                      styles:
                        card:
                          - height: "60px"
                    - type: custom:button-card
                      name: Vacuum Start
                      icon: mdi:robot-vacuum
                      tap_action:
                        action: perform-action
                        action_name: vacuum.start
                        target:
                          entity_id: vacuum.roborock_s7
                      styles:
                        card:
                          - height: "60px"
                    - type: custom:button-card
                      name: TV Off
                      icon: mdi:television-off
                      tap_action:
                        action: perform-action
                        action_name: media_player.turn_off
                        target:
                          entity_id: media_player.master_bedroom_tv
                      styles:
                        card:
                          - height: "60px"

          # --- SYSTEM HEALTH ---
          system:
            - type: vertical-stack
              cards:
                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: "System Health"

                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: "{{ states('sensor.backup_backup_manager_state') }}"
                      secondary: "Backup Manager"
                      icon: mdi:backup-restore
                      entity: sensor.backup_backup_manager_state
                      tap_action:
                        action: more-info
                        entity: sensor.backup_backup_manager_state
                      style:
                        ha-card:
                          - height: "55px"
                    - type: custom:mushroom-template-card
                      primary: "{{ states('sensor.backup_last_successful_automatic_backup') }}"
                      secondary: "Last OK backup"
                      icon: mdi:cloud-check
                      entity: sensor.backup_last_successful_automatic_backup
                      tap_action:
                        action: more-info
                        entity: sensor.backup_last_successful_automatic_backup
                      style:
                        ha-card:
                          - height: "55px"
                    - type: custom:mushroom-template-card
                      primary: "{{ states('sensor.git_ha_ppens_branch') }}"
                      secondary: "git-ha-ppens"
                      icon: mdi:git
                      entity: sensor.git_ha_ppens_branch
                      tap_action:
                        action: more-info
                        entity: sensor.git_ha_ppens_branch
                      style:
                        ha-card:
                          - height: "55px"

                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: |
                        {% if states('sensor.roborock_s7_sensor_time_left') | float < 0 %}
                        ⚠️ Roborock cliff sensor is OVERDUE for replacement ({{ states('sensor.roborock_s7_sensor_time_left') | round(0) }} hours past deadline)
                        {% endif %}
                      font_size: "small"
                      color: var(--state-error-color)

                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: |
                        {% if states('sensor.dream_machine_se_storage_utilisation') | float > 90 %}
                        ⚠️ UDM SE storage at {{ states('sensor.dream_machine_se_storage_utilisation') }}% — recordings will be deleted soon
                        {% endif %}
                      font_size: "small"
                      color: var(--accent-color)

                - type: custom:mushroom-headline
                  headline:
                    - type: text
                      text: |
                        {% if states('sensor.ecosys_m6030cdn_black_tk_5144k') | float < 15 %}
                        🖨️ Black toner low ({{ states('sensor.ecosys_m6030cdn_black_tk_5144k') }}%) — order TK-5144K
                        {% endif %}
                      font_size: "small"
                      color: var(--state-warning-color)
