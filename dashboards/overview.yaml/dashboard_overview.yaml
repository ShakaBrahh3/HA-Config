# Homelab Overview — Lovelace dashboard
# Tuned to live entity_ids from HA registry + current sensor values
# (snapshot 2026-08-28 ~23:50 AWST)
#
# Severity bands are per-gauge, picked so each gauge is in the
# "correct" colour band on first load:
#   - UDM-SE storage @ 96.74%  -> red
#   - Black toner    @ 11%     -> sits at the red/yellow boundary
#   - UDM-SE CPU     @ 24.7%   -> green band
#   - UDM-SE MEM     @ 63.1%   -> yellow band
#   - U6+ / USW Flex CPU/MEM   -> green band

title: Homelab Overview
views:
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    cards:

      # =========================================================
      # SECTION 1: HEADER STRIP
      # Two glance cards: home context + live alerts.
      # =========================================================
      - type: horizontal-stack
        cards:

          - type: glance
            title: Home
            entities:
              - entity: person.chartwell
                name: You
              - entity: sun.sun
                name: Sun
              - entity: weather.forecast_home
                name: Weather
              - entity: sensor.bm_oppo_x8_pro_battery_level
                name: Phone
                icon: mdi:cellphone

          - type: glance
            title: Alerts
            entities:
              - entity: binary_sensor.g5_dome_person_detected
                name: G5 person
                icon: mdi:account-alert
              - entity: binary_sensor.g5_dome_motion
                name: G5 motion
              - entity: binary_sensor.g3_bullet_motion
                name: G3 motion
              - entity: binary_sensor.g3_bullet_motion_2
                name: G3b motion
              - entity: binary_sensor.unifi_dream_machine_wan_status
                name: WAN
                icon: mdi:wan

      # =========================================================
      # SECTION 2: CAMERAS
      # =========================================================
      - type: heading
        content: Security & Cameras

      - type: picture-glance
        title: G5 Dome
        entities:
          - entity: binary_sensor.g5_dome_person_detected
          - entity: binary_sensor.g5_dome_motion
          - entity: binary_sensor.g5_dome_is_dark
        camera_image: camera.g5_dome_high_resolution_channel
        camera_view: live
        show_state: false

      - type: picture-glance
        title: G3 Bullet
        entities:
          - entity: binary_sensor.g3_bullet_motion
          - entity: binary_sensor.g3_bullet_is_dark
        camera_image: camera.g3_bullet_high_resolution_channel
        camera_view: live
        show_state: false

      - type: picture-glance
        title: G3 Bullet 2
        entities:
          - entity: binary_sensor.g3_bullet_motion_2
          - entity: binary_sensor.g3_bullet_is_dark_2
        camera_image: camera.g3_bullet_high_resolution_channel_2
        camera_view: live
        show_state: false

      # =========================================================
      # SECTION 3: NETWORK
      # UDM-SE storage is the single biggest "needs attention" gauge
      # on the dashboard, so it gets its own card above the others.
      # =========================================================
      - type: heading
        content: Network

      - type: gauge
        entity: sensor.dream_machine_se_storage_utilisation
        name: UDM SE Disk
        unit: '%'
        min: 0
        max: 100
        needle: true
        severity:
          red: 85        # current 96.74 sits comfortably above -> red
          yellow: 70
          green: 0

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.dream_machine_se_cpu_utilization
            name: UDM SE CPU
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 70
              yellow: 40
              green: 0
          - type: gauge
            entity: sensor.dream_machine_se_memory_utilization
            name: UDM SE MEM
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 80
              yellow: 60
              green: 0
          - type: gauge
            entity: sensor.unifi_dream_machine_external_ip
            name: External IP
            min: 0
            max: 1

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.u6_cpu_utilization
            name: U6+ CPU
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 70
              yellow: 40
              green: 0
          - type: gauge
            entity: sensor.u6_memory_utilization
            name: U6+ MEM
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 80
              yellow: 60
              green: 0
          - type: gauge
            entity: sensor.usw_flex_cpu_utilization
            name: Flex CPU
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 70
              yellow: 40
              green: 0
          - type: gauge
            entity: sensor.usw_flex_memory_utilization
            name: Flex MEM
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 80
              yellow: 60
              green: 0

      - type: history-graph
        title: Internet Throughput (24h)
        hours_to_show: 24
        entities:
          - entity: sensor.unifi_dream_machine_download_speed
            name: Down
          - entity: sensor.unifi_dream_machine_upload_speed
            name: Up

      # =========================================================
      # SECTION 4: CLIMATE
      # =========================================================
      - type: heading
        content: Climate

      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true

      # =========================================================
      # SECTION 5: LIVING SPACES — lights & media
      # =========================================================
      - type: heading
        content: Living Spaces

      - type: horizontal-stack
        cards:
          - type: light
            entity: light.front_door_light
          - type: media-control
            entity: media_player.main_lounge_speaker
          - type: media-control
            entity: media_player.samsung_q60_series_75_qa75q60rawxxy
          - type: media-control
            entity: media_player.mibox4

      # =========================================================
      # SECTION 6: VACUUM
      # Includes the overdue-sensor alert visible at a glance.
      # =========================================================
      - type: heading
        content: Vacuum

      - type: glance
        title: Roborock S7
        entities:
          - entity: vacuum.roborock_s7
            name: State
          - entity: sensor.roborock_s7_battery
            name: Battery
          - entity: sensor.roborock_s7_status
            name: Status
          - entity: sensor.roborock_s7_sensor_time_left
            name: Sensor due
            icon: mdi:alarm

      - type: horizontal-stack
        cards:
          - type: button
            entity: vacuum.roborock_s7
            name: Start
            icon: mdi:play
            show_state: false
            tap_action:
              action: perform-action
              action_name: vacuum.start
              target:
                entity_id: vacuum.roborock_s7
          - type: button
            entity: vacuum.roborock_s7
            name: Pause
            icon: mdi:pause
            show_state: false
            tap_action:
              action: perform-action
              action_name: vacuum.pause
              target:
                entity_id: vacuum.roborock_s7
          - type: button
            entity: vacuum.roborock_s7
            name: Home
            icon: mdi:home
            show_state: false
            tap_action:
              action: perform-action
              action_name: vacuum.return_to_base
              target:
                entity_id: vacuum.roborock_s7

      # =========================================================
      # SECTION 7: PRINTER + MAINTENANCE
      # =========================================================
      - type: heading
        content: Printer

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.ecosys_m6030cdn_black_tk_5144k
            name: Black
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10        # current 11 -> just above red, order now
              yellow: 25     # current 22 -> visible yellow
              green: 50
          - type: gauge
            entity: sensor.ecosys_m6030cdn_cyan_tk_5144c
            name: Cyan
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.ecosys_m6030cdn_magenta_tk_5144m
            name: Magenta
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.ecosys_m6030cdn_yellow_tk_5144y
            name: Yellow
            unit: '%'
            min: 0
            max: 100
            severity:
              red: 10
              yellow: 25
              green: 50

      # =========================================================
      # SECTION 8: UPDATES
      # =========================================================
      - type: heading
        content: Updates

      - type: glance
        title: HACS + Integrations
        entities:
          - entity: update.hacs_update
            name: HACS
          - entity: update.mushroom_update
            name: Mushroom
          - entity: update.unifi_device_card_update
            name: UniFi Card
          - entity: update.git_ha_ppens_update
            name: git-ha-ppens
          - entity: update.mcp_server_http_transport_update
            name: MCP Server
          - entity: update.ssh_update
            name: SSH

      - type: glance
        title: UniFi Firmware
        entities:
          - entity: update.dream_machine_se
            name: UDM SE
          - entity: update.u6
            name: U6+
          - entity: update.u6_2
            name: U6+ #2
          - entity: update.usw_flex
            name: USW Flex

      # =========================================================
      # SECTION 9: QUICK ACTIONS
      # =========================================================
      - type: heading
        content: Quick Actions

      - type: horizontal-stack
        cards:
          - type: button
            name: Front Door
            icon: mdi:lightbulb
            show_state: false
            tap_action:
              action: perform-action
              action_name: light.toggle
              target:
                entity_id: light.front_door_light
          - type: button
            name: Vacuum Start
            icon: mdi:robot-vacuum
            show_state: false
            tap_action:
              action: perform-action
              action_name: vacuum.start
              target:
                entity_id: vacuum.roborock_s7
          - type: button
            name: Vacuum Home
            icon: mdi:home
            show_state: false
            tap_action:
              action: perform-action
              action_name: vacuum.return_to_base
              target:
                entity_id: vacuum.roborock_s7
          - type: button
            name: TV Power
            icon: mdi:television
            show_state: false
            tap_action:
              action: perform-action
              action_name: remote.toggle
              target:
                entity_id: remote.samsung_q60_series_75_qa75q60rawxxy
